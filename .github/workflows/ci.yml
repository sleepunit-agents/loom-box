name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # The runtime's slots and bundle parts are age files: their tests run against the real thing.
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      # loom at main, built, so the tests that check this piece against loom's own validators (contract.test: the
      # page vocabulary; rename.test: the loom block) run here instead of being skipped.
      - uses: actions/checkout@v4
        with:
          repository: sleepunit-agents/loom
          ref: main
          path: .loom
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx tsc
        working-directory: .loom
      # The approvals piece at main, so a house body's merge-rule check runs end to end against this runtime's statement
      # (house-merge-rule.test) instead of being skipped.
      - uses: actions/checkout@v4
        with:
          repository: sleepunit-agents/loom-approvals
          ref: main
          path: .loom-approvals
      - run: npm test
        env:
          LOOM_DIST: ${{ github.workspace }}/.loom/dist
          LOOM_APPROVALS: ${{ github.workspace }}/.loom-approvals/bin/approvals
