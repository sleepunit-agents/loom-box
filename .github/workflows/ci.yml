name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # The runtime's slots and bundle parts are age files: their tests run against the real thing.
      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          age_tmp=$(mktemp -d)
          trap 'rm -rf "$age_tmp"' EXIT
          if curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            --output "$age_tmp/age.tar.gz"; then
            # Fail closed on a checksum mismatch; apt is only a download fallback.
            echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $age_tmp/age.tar.gz" | sha256sum --check
            tar -xzf "$age_tmp/age.tar.gz" -C "$age_tmp"
            mkdir -p "$HOME/.local/bin"
            install -m 0755 "$age_tmp/age/age" "$age_tmp/age/age-keygen" "$HOME/.local/bin/"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          else
            echo "::warning::age release download failed; falling back to apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          age --version
          age-keygen --version
      # loom at main, built, so the tests that check this piece against loom's own validators (contract.test: the
      # page vocabulary; rename.test: the loom block) run here instead of being skipped.
      - uses: actions/checkout@v4
        with:
          repository: sleepunit-agents/loom
          ref: main
          path: .loom
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx tsc
        working-directory: .loom
      # The approvals piece at main, so a house body's merge-rule check runs end to end against this runtime's statement
      # (house-merge-rule.test) instead of being skipped.
      - uses: actions/checkout@v4
        with:
          repository: sleepunit-agents/loom-approvals
          ref: main
          path: .loom-approvals
      - run: python3 scripts/check-model-calls
      - run: npm test
        env:
          LOOM_DIST: ${{ github.workspace }}/.loom/dist
          LOOM_APPROVALS: ${{ github.workspace }}/.loom-approvals/bin/approvals
