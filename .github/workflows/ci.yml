name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # The runtime's slots and bundle parts are age files: their tests run against the real thing.
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: npm test
